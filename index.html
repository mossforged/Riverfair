<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riverfair</title>
<meta name="description" content="Riverfair: a market race beneath the Avian Ascendancy. Play online with friends or against AI traders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c5236">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="art/app/favicon-64.png">
<link rel="apple-touch-icon" href="art/app/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=202610211635">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="brandName">Riverfair</h1><span id="roundInfo"></span></div>
    <div class="row">
      <button class="btn" id="codeChip" hidden title="Copy the invite link"></button>
      <button class="btn icon" id="soundBtn" aria-pressed="true"></button>
      <button class="btn icon" id="musicBtn" aria-pressed="false"></button>
      <button class="btn" id="rulesBtn">How to play</button>
      <button class="btn" id="newBtn">Menu</button>
    </div>
  </header>
  <section id="home" hidden></section>
  <section id="lobby" hidden></section>
  <div id="table" hidden>
    <div class="banner" id="banner"></div>
    <div class="main">
      <div style="display:grid;gap:14px;min-width:0">
        <div class="board" id="board"></div>
        <div class="card" id="panel"></div>
      </div>
      <div class="side">
        <div class="card"><h4>Merchants</h4><div id="players"></div></div>
        <div class="card"><h4>Game log</h4><ul class="log" id="log"></ul></div>
      </div>
    </div>
  </div>
  <p class="foot" id="footText"></p>
</div>
<div id="sheetWrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="dock"><div id="moveBar" hidden></div><div id="myStrip" hidden></div></div>
<div id="toast" hidden></div>
<script src="themes/riverfair.js?v=202610211635"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
<script src="game.js?v=202610211635"></script>
</body>
</html>
